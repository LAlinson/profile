<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Currículos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* Top bar */
        .topbar {
            background: #2c3e50;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .topbar h1 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .topbar span {
            font-size: 13px;
            color: #a8c5c0;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Main */
        .main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px 30px;
            flex: 1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-card .label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        /* Section header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 20px;
            color: #2c3e50;
        }

        /* Buttons */
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* User grid */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* User card */
        .user-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            background: linear-gradient(135deg, #2c3e50, #4a4a4a);
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-photo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid #a8c5c0;
            object-fit: cover;
            object-position: center top;
            background: #666;
            flex-shrink: 0;
        }

        .card-photo-placeholder {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid #a8c5c0;
            background: #a8c5c0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 16px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-role {
            font-size: 12px;
            color: #a8c5c0;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-body {
            padding: 18px 20px;
        }

        .card-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }

        .card-detail .icon {
            font-size: 14px;
        }

        .card-date {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }

        .card-actions {
            padding: 14px 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #555;
        }

        .empty-state p {
            margin-bottom: 25px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #ddd;
            color: #555;
        }

        .btn-outline:hover {
            background: #f5f5f5;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #27ae60;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div>
            <h1>📋 Gerenciador de Currículos</h1>
            <span>Sistema multi-usuário</span>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-warning" onclick="exportAll()">📥 Exportar Todos</button>
            <button class="btn btn-warning" onclick="importAll()">📤 Importar</button>
            <button class="btn btn-success" onclick="openAddModal()">➕ Novo Usuário</button>
        </div>
    </div>

    <div class="main">
        <div class="stats-bar">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">Usuários cadastrados</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalExperiences">0</div>
                <div class="label">Experiências registradas</div>
            </div>
            <div class="stat-card">
                <div class="number" id="lastUpdated">-</div>
                <div class="label">Último cadastro</div>
            </div>
        </div>

        <div class="section-header">
            <h2>👥 Usuários</h2>
        </div>

        <div class="users-grid" id="usersGrid">
            <!-- Cards rendered by JS -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <h3 id="modalTitle">➕ Novo Usuário</h3>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>Nome Completo *</label>
                <input type="text" id="inputName" placeholder="Ex: João Silva">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="inputEmail" placeholder="joao@email.com">
            </div>
            <div class="form-group">
                <label>Cargo / Posição</label>
                <input type="text" id="inputRole" placeholder="Ex: Tech Manager">
            </div>
            <div class="form-group">
                <label>Localização</label>
                <input type="text" id="inputLocation" placeholder="Ex: São Paulo, SP">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveUser()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

    <script src="js/user-manager.js"></script>
    <script>
        async function init() {
            await userManager.loadUsers();
            renderUsers();
            updateStats();
        }

        function renderUsers() {
            const grid = document.getElementById('usersGrid');
            const users = userManager.getAll();

            if (users.length === 0) {
                grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <div class="icon">👤</div>
                    <h3>Nenhum usuário cadastrado</h3>
                    <p>Comece adicionando o primeiro usuário ao sistema.</p>
                    <button class="btn btn-primary" onclick="openAddModal()">➕ Adicionar Usuário</button>
                </div>`;
                return;
            }

            grid.innerHTML = users.map(user => {
                const initial = user.name.charAt(0).toUpperCase();
                const expCount = user.resumeData?.experience?.length || 0;
                const photoHtml = user.photo && user.photo !== 'profile-photo.png'
                    ? `<img src="${user.photo}" class="card-photo" alt="${user.name}" onerror="this.style.display='none'">`
                    : `<div class="card-photo-placeholder">${initial}</div>`;

                return `
            <div class="user-card">
                <div class="card-header">
                    ${photoHtml}
                    <div class="card-info">
                        <div class="card-name">${user.name}</div>
                        <div class="card-role">${user.role || 'Sem cargo definido'}</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-detail"><span class="icon">✉️</span>${user.email || '-'}</div>
                    <div class="card-detail"><span class="icon">📍</span>${user.location || '-'}</div>
                    <div class="card-detail"><span class="icon">💼</span>${expCount} experiência(s)</div>
                    <div class="card-date">Criado em: ${user.createdAt || '-'}</div>
                </div>
                <div class="card-actions">
                    <a href="admin.html?user=${user.id}" class="btn btn-primary btn-sm">✏️ Editar Currículo</a>
                    <a href="resume.html?user=${user.id}" class="btn btn-success btn-sm" target="_blank">👁️ Ver</a>
                    <button class="btn btn-warning btn-sm" onclick="editUser('${user.id}')">⚙️</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser('${user.id}')">🗑️</button>
                </div>
            </div>`;
            }).join('');
        }

        function updateStats() {
            const users = userManager.getAll();
            document.getElementById('totalUsers').textContent = users.length;
            const totalExp = users.reduce((sum, u) => sum + (u.resumeData?.experience?.length || 0), 0);
            document.getElementById('totalExperiences').textContent = totalExp;
            const last = users[users.length - 1];
            document.getElementById('lastUpdated').textContent = last ? last.createdAt : '-';
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '➕ Novo Usuário';
            document.getElementById('editUserId').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputRole').value = '';
            document.getElementById('inputLocation').value = '';
            document.getElementById('userModal').classList.add('open');
        }

        function editUser(id) {
            const user = userManager.getById(id);
            if (!user) return;
            document.getElementById('modalTitle').textContent = '✏️ Editar Usuário';
            document.getElementById('editUserId').value = id;
            document.getElementById('inputName').value = user.name;
            document.getElementById('inputEmail').value = user.email;
            document.getElementById('inputRole').value = user.role || '';
            document.getElementById('inputLocation').value = user.location || '';
            document.getElementById('userModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('open');
        }

        function saveUser() {
            const id = document.getElementById('editUserId').value;
            const name = document.getElementById('inputName').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const role = document.getElementById('inputRole').value.trim();
            const location = document.getElementById('inputLocation').value.trim();

            if (!name || !email) {
                showToast('Nome e email são obrigatórios!', 'error');
                return;
            }

            if (id) {
                userManager.update(id, { name, email, role, location });
                showToast('✅ Usuário atualizado!');
            } else {
                userManager.add({ name, email, role, location });
                showToast('✅ Usuário criado! Clique em "Editar Currículo" para preencher os dados.');
            }

            closeModal();
            renderUsers();
            updateStats();
        }

        function deleteUser(id) {
            const user = userManager.getById(id);
            if (!user) return;
            if (confirm(`Tem certeza que deseja excluir "${user.name}"? Esta ação não pode ser desfeita.`)) {
                userManager.delete(id);
                renderUsers();
                updateStats();
                showToast('🗑️ Usuário excluído.');
            }
        }

        function exportAll() {
            const json = userManager.exportJSON();
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'users-backup.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ Backup exportado!');
        }

        function importAll() {
            document.getElementById('importInput').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const ok = userManager.importJSON(e.target.result);
                if (ok) {
                    renderUsers();
                    updateStats();
                    showToast('✅ Dados importados com sucesso!');
                } else {
                    showToast('❌ Arquivo JSON inválido.', 'error');
                }
            };
            reader.readAsText(file);
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (type === 'error' ? ' error' : '');
            setTimeout(() => toast.className = 'toast', 4000);
        }

        // Close modal on overlay click
        document.getElementById('userModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        init();
    </script>
</body>

</html>
